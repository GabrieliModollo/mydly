services:
  postgres:
    image: postgres:17-alpine
    container_name: mydly-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mydly}
      POSTGRES_USER: ${POSTGRES_USER:-mydly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mydly}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mydly} -d ${POSTGRES_DB:-mydly}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # backend e frontend entram aqui quando forem criados

volumes:
  postgres-data:
