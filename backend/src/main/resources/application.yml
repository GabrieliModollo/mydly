spring:
  application:
    name: mydly
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mydly}
    username: ${POSTGRES_USER:mydly}
    password: ${POSTGRES_PASSWORD:mydly}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  modulith:
    events:
      # Eventos que ficaram sem concluir (a aplicação caiu, um consumidor falhou) são reenviados ao subir.
      republish-outstanding-events-on-restart: true
      # O evento concluído é apagado: ele traz o texto e o valor do lançamento, que já estão em entry (LGPD).
      completion-mode: delete

springdoc:
  swagger-ui:
    path: /swagger-ui.html

mydly:
  week:
    # Dia em que a semana do resumo começa (ADR 0009); vira preferência do usuário na etapa de metas.
    first-day-of-week: MONDAY
  events:
    # Nova tentativa dos eventos entre módulos que ficaram sem concluir (ADR 0008).
    retry-interval: PT1M
    retry-older-than: PT1M
    # Depois disso, um evento incompleto deixa o /actuator/health OUT_OF_SERVICE.
    stale-after: PT10M

management:
  endpoints:
    web:
      exposure:
        include: health, info
