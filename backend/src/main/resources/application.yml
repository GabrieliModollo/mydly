spring:
  application:
    name: mydly
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mydly}
    username: ${POSTGRES_USER:mydly}
    password: ${POSTGRES_PASSWORD:mydly}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Extrato OFX ou CSV (ADR 0014).
      max-file-size: 2MB
      max-request-size: 3MB
  modulith:
    events:
      # Eventos que ficaram sem concluir (a aplicação caiu, um consumidor falhou) são reenviados ao subir.
      republish-outstanding-events-on-restart: true
      # O evento concluído é apagado: ele traz o texto e o valor do lançamento, que já estão em entry (LGPD).
      completion-mode: delete

springdoc:
  swagger-ui:
    path: /swagger-ui.html

mydly:
  llm:
    # Chave da API da Anthropic para o LLM de fallback do parser (ADR 0013). Vazia: só regras locais.
    api-key: ${LLM_API_KEY:}
    model: claude-opus-5-5
    # Quanto o lançamento espera o LLM antes de seguir com o que as regras entenderam.
    timeout: PT15S
  auth:
    # Segredo dos tokens (HS256), com pelo menos 32 bytes. Vazio gera um aleatório a cada subida, e os
    # tokens deixam de valer quando a aplicação reinicia (ADR 0012).
    jwt-secret: ${MYDLY_JWT_SECRET:}
    token-ttl: P7D
  # O dia de início da semana é preferência do usuário, na tabela preferences (ADR 0010).
  events:
    # Nova tentativa dos eventos entre módulos que ficaram sem concluir (ADR 0008).
    retry-interval: PT1M
    retry-older-than: PT1M
    # Depois disso, um evento incompleto deixa o /actuator/health OUT_OF_SERVICE.
    stale-after: PT10M

management:
  endpoints:
    web:
      exposure:
        include: health, info
