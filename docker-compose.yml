services:
  postgres:
    image: postgres:17-alpine
    container_name: mydly-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mydly}
      POSTGRES_USER: ${POSTGRES_USER:-mydly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mydly}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mydly} -d ${POSTGRES_DB:-mydly}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: mydly-backend
    environment:
      DB_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-mydly}
      POSTGRES_USER: ${POSTGRES_USER:-mydly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mydly}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: mydly-frontend
    ports:
      - "8100:80"
    depends_on:
      - backend

volumes:
  postgres-data:
