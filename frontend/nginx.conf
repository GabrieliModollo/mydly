server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API no mesmo endereço do app (sem CORS). O corpo das requisições não vai para o log (LGPD).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome podem ficar em cache por muito tempo.
    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # O index.html nunca fica em cache, para o app atualizar logo após um deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Rotas do Angular caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
